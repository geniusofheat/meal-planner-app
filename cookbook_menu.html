<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookbook</title>

<meta name="theme-color" content="#c8a96e">

<link rel="manifest" href="meal_planner_manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Playfair+Display:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cookbook_menu_stylesheet.css">
</head>

<body>

<div id="breadcrumb"></div>

<header>
  <h3 id="pageTitle">📖  &nbsp;&nbsp;Cookbook :</h3>
  <div class="notepad-date" id="dateDisplay"></div>
  <div class="help-btn-wrap">
    <div class="help-btn" id="helpBtn" onclick="show_help_modal()">?</div>
    <div class="help-btn-label">help</div>
  </div>
</header>

<p id="mainPageDescription">Please choose an item in the list or click Help for more instructions.</p>

<!-- Search results message -->
<div id="search_results" class="search-error-message"></div>

<main class="main">

  <div id="notes-list-view">
    <div class="notepad-body">
      <div id="notes-list"></div>
    </div>
  </div>
  <!-- END NOTES LIST VIEW -->

  <div id="recipe-editor-view" style="display:none;">

    <div class="note-editor-sticky-toolbar">
      <div class="toolbar-row">
        <h3 id="recipe-title-display"></h3>
        <button class="orange-btn" id="headerBackBtn" onclick="back_to_list()" style="display:none;">← Back</button>
      </div>
    </div>

    <div class="notepad-body">
      <div id="recipe-editor-body"></div>
    </div>

  </div>
  <!-- END RECIPE EDITOR VIEW -->

</main>

<!-- ── HELP MODAL ── -->
<div id="helpModalOverlay" class="help-modal-overlay" style="display:none;" onclick="hide_help_modal(event)">
  <div class="help-modal" onclick="event.stopPropagation()">
    <div class="help-modal-header">
      <h3>Help</h3>
      <div class="fmt-btn" onmousedown="event.preventDefault()" onclick="hide_help_modal()">✕</div>
    </div>
    <div class="help-modal-body" id="helpModalBody">
      <!-- filled in by show_help_modal() -->
    </div>
  </div>
</div>
<!-- END HELP MODAL -->

<!-- ── ADD RECIPE MODAL (per-category) — reuses the same help-modal classes ── -->
<div id="addRecipeModalOverlay" class="help-modal-overlay" style="display:none;" onclick="close_add_recipe_modal()">
  <div class="help-modal" onclick="event.stopPropagation()">
    <div class="help-modal-header">
      <h3 id="add_recipe_modal_title">Add Recipe :</h3>
      <div class="fmt-btn" onmousedown="event.preventDefault()" onclick="close_add_recipe_modal()">✕</div>
    </div>
    <div class="help-modal-body">
      <input class="text-input" type="text" id="add_recipe_name" placeholder="Recipe name">
      <input class="text-input" type="text" id="add_recipe_servings" placeholder="Serving size (e.g. Serves 4)">
      <div class="notepad-placeholder">Ingredients :</div>
      <div id="add_recipe_ingredients_list">
        <input class="text-input add-recipe-ingredient-input" type="text" placeholder="Ingredient">
      </div>
      <button class="orange-btn" onclick="add_recipe_ingredient_field()">+ Add Ingredient</button>
      <div class="notepad-placeholder">Preparation :</div>
      <textarea class="text-input" id="add_recipe_prep" placeholder="Preparation steps" style="height:100px;"></textarea>
      <button class="orange-btn" onclick="save_add_recipe_modal()">Save Recipe</button>
      <div id="add_recipe_message" class="notepad-placeholder"></div>
    </div>
  </div>
</div>
<!-- END ADD RECIPE MODAL -->

<script src="beverages_data.js"></script>
<script src="beans_and_legumes_data.js"></script>
<script src="breads_and_grains_data.js"></script>
<script src="desserts_data.js"></script>
<script src="dips_sauces_and_gravies_data.js"></script>
<script src="hard_and_soft_candy_data.js"></script>
<script src="meats_data.js"></script>
<script src="pastas_data.js"></script>
<script src="pickles_and_preserves.js"></script>
<script src="salads_data.js"></script>
<script src="soups_and_stews_data.js"></script>
<script src="vegetables_data.js"></script>
<script src="side_dishes_data.js"></script>
<script src="cookbook_menu_data.js"></script>

<script src="cookbook_engine.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('meal_planner_service_worker.js');
  }
</script>

<script type="module" src="firebase_login_auth.js"></script>

</body>
</html>
